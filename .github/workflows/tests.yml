name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - name: the committed dashboard publishes counts only
        run: python privacy_gate.py dashboard.html
      - name: python tests (research code, exporters, API, site contract)
        run: python -m pytest -q
      - name: site tests
        working-directory: food-dashboard
        run: node --test tests/*.test.mjs
