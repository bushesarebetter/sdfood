name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version-file: food-dashboard/.node-version
          cache: npm
          cache-dependency-path: food-dashboard/package-lock.json
      - run: python -m pip install -r requirements.txt
      - name: the committed dashboard publishes counts only
        run: python privacy_gate.py dashboard.html
      - name: python tests (research code, exporters, API, site contract)
        run: python -m pytest -q
      - name: the site's packages, from the lockfile, as Render installs them
        working-directory: food-dashboard
        run: npm ci
      - name: site tests (with the packages in place, so the rendered checks run too)
        working-directory: food-dashboard
        run: node --test tests/*.test.mjs
      - name: the site builds, as Render builds it (on the committed sample)
        working-directory: food-dashboard
        run: npm run build
