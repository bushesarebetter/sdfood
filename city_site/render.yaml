# The City staff site's Render settings, as a reviewed record. publish_city_site.py copies this file into
# the private deploy repository. The service was made in the dashboard, so Render does not read this file
# unless you connect it as a Blueprint; keep the two in step by hand (docs/HOSTING.md, "The City staff site").
services:
  - type: web
    name: sdfood-city
    runtime: node
    region: oregon                 # the nearest to San Diego; cannot change after creation
    # The free plan, which the service runs on. It sleeps after 15 idle minutes, and the first request
    # after that waits up to a minute while it wakes. Sleeping, like any restart or deploy, empties the
    # server's memory: everyone is signed out (sessions), the sign-in failure counters and the address
    # lookup cache start over. Render does not recommend free for production; starter ($7 a month) stays awake.
    plan: free
    branch: main
    buildCommand: npm ci && npx vite build
    startCommand: node server.mjs
    healthCheckPath: /healthz      # a new deploy that does not answer never replaces the live one
    envVars:
      - { key: NODE_VERSION, value: "24" }
      - { key: SITE_USERS, sync: false }        # "name:token,..." one sign-in per person (tokens 16+ characters)
      - { key: SITE_PASSWORD, sync: false }     # the older shared sign-in, 16+ characters, while migrating
      - { key: SITE_CONTACT, sync: false }      # who to ask for access, shown on the sign-in page
      - { key: VITE_GOOGLE_MAPS_API_KEY, sync: false }
      - { key: VITE_GOOGLE_MAPS_MAP_ID, sync: false }
