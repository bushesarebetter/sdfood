# The City staff site's daily check, run in the PRIVATE deploy repository (publish_city_site.py copies it
# to .github/workflows/watch.yml there). It reads the live site only: /healthz is open and carries no data,
# so no secret is needed and nothing is checked out. It fails when
#   - the site does not answer, or the check does not finish within its time limit (a site that hangs is
#     treated as down);
#   - Render is not serving this repository's latest commit (/healthz "source" is not GITHUB_SHA): a deploy
#     failed or is stuck;
#   - the site is closed (its sunset has passed, or it is not serving the staff export), its export is
#     stale, or the export expires in under 4 days (refresh now);
#   - the frozen rule needs a refit (/healthz "refit_needed": the record has drifted from it);
#   - the export can be read without signing in (GET /data/meta.json must be refused: 401, or a 303 to
#     /login).
# A failure opens an issue titled "staff site check failed", or comments on the one already open, so a
# problem that lasts a week is one issue, not seven; everyone watching the repository is notified.
# Without failing the check, it also opens an issue, once while it is open, when
#   - the sunset date is less than 30 days away;
#   - the latest quarter's major-violation rate differs from the label year's months before it
#     (/healthz "drift_note"), before any refit is due: the rates the site shows are probably off;
#   - the monitor has an alert, or did not run for the live list (/healthz "monitor_alert"): its sentences
#     are in ops/monitor_summary.json in this repository.
# The site's address is the repository variable SITE_URL (Settings, Secrets and variables, Actions,
# Variables), or the address below when it is unset: a new owner on another Render service sets it there.
name: watch
on:
  schedule: [{ cron: "23 14 * * *" }]     # about 07:23 in San Diego
  workflow_dispatch: {}
permissions: { issues: write }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15                    # the check's own 10, then time for the issue steps
    env: { SITE: "${{ vars.SITE_URL || 'https://sdfood-city.onrender.com' }}" }
    steps:
      - name: the live site serves main, is open and fresh, refuses data without a sign-in, and is not about to expire
        id: check
        # A step that runs out of time is marked failed, so the issue step below still runs. Worst case
        # inside it: /healthz about 300 s (no new try after 240 s, each try at most 60 s), then the two
        # sign-in checks at most 60 s each.
        timeout-minutes: 10
        run: |
          set +e -uo pipefail                 # run every check, then fail if any did
          problems="$RUNNER_TEMP/problems.md"
          notices="$RUNNER_TEMP/notices.tsv"; : > "$notices"
          # Until /healthz answers, the reason on file is that it has not: a run stopped by its time limit
          # still says why its issue was opened.
          echo "- the check did not finish: $SITE/healthz did not answer in time; treat the site as down" > "$problems"
          fail() { echo "::error::$1"; echo "- $1" >> "$problems"; }
          notice() { printf '%s\t%s\n' "$1" "$2" >> "$notices"; }
          days() { echo $(( ($(date -ud "$1" +%s) - $(date -u +%s)) / 86400 )); }
          h=$(curl -fsS --connect-timeout 20 --max-time 60 --retry 5 --retry-all-errors --retry-delay 20 --retry-max-time 240 "$SITE/healthz")   # also wakes a free instance
          if [ $? -ne 0 ] || ! jq -e . >/dev/null <<<"$h"; then
            : > "$problems"; fail "$SITE/healthz did not answer: the site is down"; cat "$problems" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          : > "$problems"
          field() { jq -r "$1 // empty" <<<"$h"; }
          got=$(field .source); exp=$(field .expires); sunset=$(field .sunset); closed=$(field .closed); rule=$(field .rule_version)
          stale=$(jq -r '.stale == true' <<<"$h"); refit=$(jq -r '.refit_needed == true' <<<"$h")
          drift_note=$(jq -r '.drift_note == true' <<<"$h"); monitor_alert=$(jq -r '.monitor_alert == true' <<<"$h")
          monitor=$(field .monitor)
          echo "live ${got:0:7} (main ${GITHUB_SHA:0:7}); export expires ${exp:-?}; sunset ${sunset:-?}; rule ${rule:-not frozen}; monitor ${monitor:-not shipped}" >> "$GITHUB_STEP_SUMMARY"

          [ "$got" = "$GITHUB_SHA" ] || fail "Render is not serving main (live ${got:0:7}, main ${GITHUB_SHA:0:7}): the last deploy failed or is stuck"
          [ -z "$closed" ] || fail "the site is closed: $closed"
          [ "$stale" = false ] || fail "the export is stale (it expired $exp): refresh it now (docs/RUNBOOK.md)"
          if [ -z "$exp" ]; then fail "the health check reports no export expiry date"
          elif [ "$(days "$exp")" -lt 4 ]; then fail "the export expires $exp: refresh it now (docs/RUNBOOK.md)"; fi
          [ "$refit" = false ] || fail "the frozen rule needs a refit: the record has drifted from it (docs/RUNBOOK.md)"

          # The export must be refused without a sign-in: 401 to a script, a 303 to /login to a browser.
          for accept in '*/*' 'text/html'; do
            read -r code loc < <(curl -sS -o /dev/null -H "Accept: $accept" -w '%{http_code} %{redirect_url}\n' --connect-timeout 20 --max-time 60 "$SITE/data/meta.json" || echo "000 -")
            case "$code" in
              401) ;;
              303) [[ "$loc" == "$SITE/login"* ]] || fail "GET /data/meta.json (Accept: $accept) without a sign-in redirects to $loc, not to /login" ;;
              200) fail "the export is served WITHOUT a sign-in (GET /data/meta.json, Accept: $accept, answered 200): take the site down now" ;;
              503) [ -n "$closed" ] || fail "GET /data/meta.json (Accept: $accept) without a sign-in answered 503" ;;
              *)   fail "GET /data/meta.json (Accept: $accept) without a sign-in answered $code, not 401 or a redirect to /login" ;;
            esac
          done

          # Issues that do not fail the check: each is opened once, while it is open (the last step).
          if [ -n "$sunset" ] && left=$(days "$sunset") && [ "$left" -ge 0 ] && [ "$left" -lt 30 ]; then
            echo "::warning::the site comes down on its sunset date, $sunset ($left days)"
            notice "staff site comes down on its sunset date, $sunset" "The site closes itself after $sunset. Before then, record a City owner and a new sunset date and publish again, or plan the take-down (docs/STAFF_SITE.md)."
          fi
          if [ "$refit" = false ] && [ "$drift_note" = true ]; then
            echo "::warning::the latest quarter's major-violation rate differs from the label year's months before it"
            notice "the latest quarter's major-violation rate differs from the label year's months before it" "The health check reports a drift note (meta.json drift.note, shown with each estimate on the site). No refit is due yet: the formal drift check needs a complete quarter after the backtest year. Until then the rates the site shows are probably off. Read the note, and tell the responsible adult, and the City's requestor or owner of the site once there is one (docs/RUNBOOK.md)."
          fi
          if [ "$monitor_alert" = true ]; then
            echo "::warning::the monitor has an alert (status ${monitor:-unknown})"
            notice "the monitor has an alert" "The live list's monitor (status ${monitor:-unknown}) has an alert, or did not run for this list. Its sentences are in ops/monitor_summary.json in this repository; docs/RUNBOOK.md, 'Reading the monitor', says what to do."
          fi
          cat "$problems" >> "$GITHUB_STEP_SUMMARY"
          [ ! -s "$problems" ]
      - name: open an issue, or add to the one already open
        # The check step past its own time limit is a failure too, so a site that hangs reports here.
        if: failure()
        timeout-minutes: 3
        env: { GH_TOKEN: "${{ github.token }}", TITLE: "staff site check failed" }
        run: |
          found="$(cat "$RUNNER_TEMP/problems.md" 2>/dev/null)"
          [ -n "$found" ] || found="- the check did not finish: treat the site as down until a check passes"
          body="$(date -u +%F): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"$'\n\n'"$found"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title \
                | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"; fi
      - name: open, once, the issues that do not fail the check (sunset near, drift note, monitor alert)
        if: always()
        timeout-minutes: 3
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          notices="$RUNNER_TEMP/notices.tsv"
          [ -s "$notices" ] || exit 0
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json title --jq '.[].title')
          while IFS=$'\t' read -r title body; do
            grep -qxF -- "$title" <<<"$open" || gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
              --body "$body $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" < /dev/null
          done < "$notices"
